<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NNI — Coming Soon</title>
  <meta name="description" content="NNI — Smart, fast, simple. Coming soon." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <div class="card">
      <header class="brand">
        <div class="logo" aria-hidden="true">NNI</div>
        <div class="tag">Coming soon</div>
      </header>

      <section class="hero">
        <h1 class="title">A smarter way to build. NNI is coming.</h1>
        <p class="lead">We’re building something simple, fast, and beautiful. Join our early access list and we’ll let you know when we launch.</p>

        <div class="countdown" aria-label="Countdown to launch" role="timer">
          <div class="time">
            <span id="days">0</span>
            <small>Days</small>
          </div>
          <div class="time">
            <span id="hours">0</span>
            <small>Hours</small>
          </div>
          <div class="time">
            <span id="minutes">0</span>
            <small>Minutes</small>
          </div>
          <div class="time">
            <span id="seconds">0</span>
            <small>Seconds</small>
          </div>
        </div>

        <form id="subscribeForm" class="subscribe" novalidate>
          <label for="email" class="visually-hidden">Email address</label>
          <input id="email" name="email" type="email" placeholder="Enter your email" autocomplete="email" required>
          <button id="subscribeBtn" type="submit">Notify me</button>
        </form>

        <p id="message" class="message" role="status" aria-live="polite"></p>
      </section>

      <footer class="foot">
        <nav class="social" aria-label="Social links">
          <a href="#" aria-label="Twitter" class="icon" title="Twitter">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 3a10.9 10.9 0 0 1-3.14 1.53A4.48 4.48 0 0 0 22.43.36a9.05 9.05 0 0 1-2.88 1.1A4.52 4.52 0 0 0 12.07 6 12.8 12.8 0 0 1 1.64 2.15 4.5 4.5 0 0 0 2.9 8.75A4.36 4.36 0 0 1 .88 8v.06A4.5 4.5 0 0 0 4.5 12.7a4.41 4.41 0 0 1-2 .08 4.5 4.5 0 0 0 4.21 3.12A9 9 0 0 1 1 19.54 12.72 12.72 0 0 0 7.29 21c8.8 0 13.62-7.29 13.62-13.62 0-.21 0-.42-.02-.63A9.8 9.8 0 0 0 23 3z"></path></svg>
          </a>
          <a href="#" aria-label="GitHub" class="icon" title="GitHub">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12c0 4.42 2.87 8.17 6.84 9.49.5.09.66-.22.66-.49 0-.24-.01-.87-.01-1.71-2.78.6-3.37-1.34-3.37-1.34-.45-1.15-1.11-1.46-1.11-1.46-.91-.62.07-.6.07-.6 1.01.07 1.54 1.04 1.54 1.04.9 1.54 2.36 1.1 2.94.84.09-.66.35-1.1.63-1.35-2.22-.25-4.56-1.11-4.56-4.95 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02A9.56 9.56 0 0 1 12 6.8a9.6 9.6 0 0 1 2.5.34c1.9-1.29 2.74-1.02 2.74-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.85-2.34 4.7-4.57 4.95.36.31.68.92.68 1.85 0 1.33-.01 2.41-.01 2.74 0 .27.16.59.67.49A10.02 10.02 0 0 0 22 12c0-5.52-4.48-10-10-10z"></path></svg>
          </a>
        </nav>
        <small>© <span id="year"></span> NNI • All rights reserved</small>
      </footer>
    </div>

    <div class="bg-shapes" aria-hidden="true"></div>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
